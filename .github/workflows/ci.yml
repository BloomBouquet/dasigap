name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "dasigap/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dasigap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dasigap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dasigap
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm prisma validate
      - name: Apply database migrations
        run: pnpm prisma migrate deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, integration, security, and forbidden-feature tests
        run: pnpm test
      - name: Validate server deployment artifacts
        run: |
          set -euo pipefail
          pnpm check:deploy
          DASIGAP_IMAGE=ghcr.io/bloombouquet/dasigap:sha-0000000000000000000000000000000000000000 \
          DASIGAP_ENV_FILE="$PWD/deploy/.env.production.example" \
            docker compose -f deploy/compose.production.yml config >/dev/null
      - name: Start S3-compatible MinIO
        run: |
          docker run -d --name dasigap-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=dasigap-ci \
            -e MINIO_ROOT_PASSWORD=dasigap-ci-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'mc alias set ci http://127.0.0.1:9000 dasigap-ci dasigap-ci-secret && mc mb --ignore-existing ci/dasigap-ci'
      - name: Real S3 signed URL integration
        env:
          RUN_S3_INTEGRATION: "1"
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_BUCKET: dasigap-ci
          OBJECT_STORAGE_ACCESS_KEY_ID: dasigap-ci
          OBJECT_STORAGE_SECRET_ACCESS_KEY: dasigap-ci-secret
        run: pnpm exec vitest run tests/integration/s3-storage.test.ts
      - name: Build
        run: pnpm build
      - name: Full Playwright E2E release suite
        run: pnpm test:e2e
