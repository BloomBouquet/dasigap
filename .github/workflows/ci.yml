name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "dasigap/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dasigap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dasigap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dasigap
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Refresh dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Persist refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/dasigap/database'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pnpm lockfile"
            git push
          fi
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
