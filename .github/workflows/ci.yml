name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "dasigap/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dasigap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dasigap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dasigap
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm prisma validate
      - name: Apply database migrations
        run: pnpm prisma migrate deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: First item E2E
        run: pnpm exec playwright test tests/e2e/first-item.spec.ts
      - name: Receipt privacy E2E
        run: pnpm exec playwright test tests/e2e/receipt-privacy.spec.ts
      - name: Resale preparation E2E
        run: pnpm exec playwright test tests/e2e/resale-flow.spec.ts
      - name: Home PWA legal E2E
        run: pnpm exec playwright test tests/e2e/home-pwa-legal.spec.ts
