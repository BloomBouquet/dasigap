name: Production Image

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "dasigap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: dasigap-smoke:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test production image
        run: |
          set -euo pipefail
          docker run -d --name dasigap-image-smoke \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke \
            -e AUTH_MODE=bouquet \
            -e BOUQUET_AUTH_BASE_URL=https://bloombouquet.https.gsmsv.site \
            -e BOUQUET_AUTH_CLIENT_ID=dasigap-smoke \
            -e BOUQUET_AUTH_REDIRECT_URI=https://dasigap.invalid/auth/bouquet/callback \
            dasigap-smoke:${{ github.sha }}

          cleanup() {
            docker rm -f dasigap-image-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:3000/api/health/live || true)"
            if BODY="$body" EXPECTED_SHA="${{ github.sha }}" node -e '
              try {
                const value = JSON.parse(process.env.BODY || "");
                process.exit(value.status === "ok" && value.release === process.env.EXPECTED_SHA ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs dasigap-image-smoke
            exit 1
          fi

      - name: Build local migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          load: true
          push: false
          tags: dasigap-migrator-smoke:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test migration image
        run: |
          set -euo pipefail
          docker run -d --name dasigap-migration-postgres \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dasigap_migration \
            postgres:17-alpine

          cleanup() {
            docker rm -f dasigap-migration-postgres >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec dasigap-migration-postgres pg_isready -U postgres -d dasigap_migration >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55432/dasigap_migration \
            dasigap-migrator-smoke:${{ github.sha }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable migration tag
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/bloombouquet/dasigap:migrate-sha-${{ github.sha }}
          cache-from: type=gha

      - name: Publish immutable and latest tags
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/bloombouquet/dasigap:sha-${{ github.sha }}
            ghcr.io/bloombouquet/dasigap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
