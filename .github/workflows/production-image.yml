name: Production Image

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "dasigap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: dasigap-smoke:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test production image
        run: |
          set -euo pipefail
          docker run -d --name dasigap-image-smoke \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke \
            -e AUTH_MODE=bouquet \
            -e BOUQUET_AUTH_BASE_URL=https://bloombouquet.https.gsmsv.site \
            -e BOUQUET_AUTH_CLIENT_ID=dasigap-smoke \
            -e BOUQUET_AUTH_REDIRECT_URI=https://dasigap.invalid/auth/bouquet/callback \
            dasigap-smoke:${{ github.sha }}

          cleanup() {
            docker rm -f dasigap-image-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs dasigap-image-smoke
            exit 1
          fi

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and latest tags
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bloombouquet/dasigap:sha-${{ github.sha }}
            ghcr.io/bloombouquet/dasigap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
